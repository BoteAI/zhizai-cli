name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: zhizai-cli_darwin_amd64
          - goos: darwin
            goarch: arm64
            name: zhizai-cli_darwin_arm64
          - goos: linux
            goarch: amd64
            name: zhizai-cli_linux_amd64
          - goos: linux
            goarch: arm64
            name: zhizai-cli_linux_arm64
          - goos: windows
            goarch: amd64
            name: zhizai-cli_windows_amd64.exe
          - goos: windows
            goarch: arm64
            name: zhizai-cli_windows_arm64.exe
          # OpenHarmony / HarmonyOS: Node reports platform "openharmony".
          # Build pure-Go static linux/arm64 and package under openharmony name.
          - goos: openharmony
            goarch: arm64
            build_goos: linux
            build_goarch: arm64
            name: zhizai-cli_openharmony_arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.build_goos || matrix.goos }}
          GOARCH: ${{ matrix.build_goarch || matrix.goarch }}
          ASSET_GOOS: ${{ matrix.goos }}
          ASSET_GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          VERSION_NUM=${VERSION#v}
          if [ "${ASSET_GOOS}" = "windows" ]; then
            BINARY_NAME="zhizai.exe"
          else
            BINARY_NAME="zhizai"
          fi
          export CGO_ENABLED=0
          go build -ldflags "-X github.com/BoteAI/zhizai-cli/internal/version.Version=${VERSION} -s -w" -o "${BINARY_NAME}" .
          if [ "${ASSET_GOOS}" = "windows" ]; then
            zip "zhizai-cli_${VERSION_NUM}_${ASSET_GOOS}_${ASSET_GOARCH}.zip" "${BINARY_NAME}"
          else
            tar -czf "zhizai-cli_${VERSION_NUM}_${ASSET_GOOS}_${ASSET_GOARCH}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            zhizai-cli_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            zhizai-cli_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sync package versions
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node scripts/sync-npm-versions.js "$VERSION"

      - name: Publish platform packages and @zhizai/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
          DIST_DIR: dist
        run: |
          VERSION=${VERSION#v}
          export VERSION
          chmod +x scripts/publish-npm-packages.sh
          bash scripts/publish-npm-packages.sh

      - name: Trigger npmmirror sync
        if: success()
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pkgs=(
            "@zhizai/cli"
            "@zhizai/cli-darwin-arm64"
            "@zhizai/cli-darwin-x64"
            "@zhizai/cli-linux-arm64"
            "@zhizai/cli-linux-x64"
            "@zhizai/cli-openharmony-arm64"
            "@zhizai/cli-windows-x64"
            "@zhizai/cli-windows-arm64"
          )
          for pkg in "${pkgs[@]}"; do
            echo "==> sync ${pkg}@${VERSION}"
            curl -fsS -X PUT "https://registry.npmmirror.com/${pkg}/sync" || true
          done
